name: Build A33 U-Boot

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-arm-linux-gnueabihf bison flex bc libssl-dev libgnutls28-dev \
            python3 python3-dev python3-setuptools python3-pyelftools swig device-tree-compiler u-boot-tools

      - name: Clone pinned U-Boot
        run: |
          git clone https://github.com/u-boot/u-boot.git $HOME/u-boot
          git -C $HOME/u-boot checkout e50b1e8715011def8aff1588081a2649a2c6cd47

      - name: Build SD-boot U-Boot and dump script
        run: |
          chmod +x scripts/a33-sdboot/build.sh
          bash scripts/a33-sdboot/build.sh $HOME/u-boot

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a33-sdboot-artifacts
          path: diagnostics/a33-sdboot/
