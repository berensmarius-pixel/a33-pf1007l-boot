name: Dashboard Tests

on:
  push:
    paths: [ 'dashboard/**', '.github/workflows/dashboard-tests.yml' ]
  pull_request:
    paths: [ 'dashboard/**' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests (Kalender-Parser, Aufgaben, Wetterwarnungen, EXIF, Zugangsschutz)
        run: npm test

      - name: Bauen (prüft, dass das Dashboard kompiliert)
        run: npm run build
