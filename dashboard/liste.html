    function categorize(name) {
      var n = name.toLowerCase();
      var hit = CATALOG.filter(function (c) { return c[0].toLowerCase() === n; })[0] ||
        CATALOG.filter(function (c) { var a = c[0].toLowerCase(); return a.indexOf(n) > -1 || n.indexOf(a) > -1; })[0] ||
        CATALOG.filter(function (c) { return n.split(/\s+/).some(function (w) { return w.length > 3 && c[0].toLowerCase().indexOf(w) > -1; }); })[0];
      return hit ? hit[1] : 'Sonstiges';
    }

    function today() {
      var n = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
      return n.getFullYear() + '-' + p(n.getMonth() + 1) + '-' + p(n.getDate());
    }

    function inflate(name, items) {

        var t = today();

      }
      return items;
    }

    function load(name) {
      var headers = {};
      if (revs[name]) headers['If-None-Match'] = '"rev-' + revs[name] + '"';
      return fetch('/api/list/' + name, { headers: headers, cache: 'default' })
        .then(function (r) {
          if (r.status === 304) return null;
          return r.ok ? r.json() : null;
        })
        .then(function (d) {
          if (!d || busy) return;
          revs[name] = d.rev || 0;
          data[name] = inflate(name, d.items || []);
          loaded = true;
          render();
        })
        .catch(function () {});
    }
    function loadAll() {
      NAMES.forEach(load);
      checkGeminiKey();
    }
    function loadActive() {
      ['groceries', 'chores', 'meals'].forEach(load);
      if (tab === 'recipes') load('recipes');
    }

    function checkGeminiKey() {
      fetch('/api/settings/gemini').then(function (r) { return r.json(); }).then(function (res) {
        if (res && res.ok) hasGeminiKey = Boolean(res.hasKey);
      }).catch(function () {});
    }

    function post(name, op) {
      function go() {
        return fetch('/api/list/' + name, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Pin': localStorage.getItem('upload_pin') || '' },
          body: JSON.stringify(op)
        });
      }
      busy++;
      return go().then(function (r) {
        if (r.status !== 401) return r;
        var pin = prompt('PIN zum Speichern:');
        if (!pin) return r;
        localStorage.setItem('upload_pin', pin);
        return go();
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (d) {
        busy--;
        if (d && d.rev) revs[name] = d.rev;
        if (!busy) { data[name] = inflate(name, d.items || []); render(); }
      }).catch(function () {
        busy--;
        toast('Nicht gespeichert (PIN oder Netz)');
        load(name);
      });
    }

    function save(name, items) {
      var out = items.map(function (i) {
        var o = {};
        Object.keys(i).forEach(function (k) { if (k !== 'done' || name === 'groceries') o[k] = i[k]; });
        if (name === 'chores') o.doneOn = i.done ? today() : null;
        return o;
      });
      post(name, { upsert: out });
    }
    function remove(name, ids) {
      data[name] = data[name].filter(function (i) { return ids.indexOf(i.id) < 0; });
      render();
      post(name, { remove: ids });
    }

    // ---------------- Einkauf
    function addGrocery(text) {
      text = text.trim();
      if (!text) return;
      var low = text.toLowerCase();
      var hit = data.groceries.filter(function (g) { return g.name.toLowerCase() === low; })[0];
      if (hit) { hit.done ? (hit.done = false, hit.qty = 1) : hit.qty++; save('groceries', [hit]); }
      else {
        var matched = CATALOG.filter(function (c) { return c[0].toLowerCase() === low; })[0];
        hit = { id: uid('g'), name: matched ? matched[0] : (text.charAt(0).toUpperCase() + text.slice(1)), cat: categorize(text), qty: 1, store: 'rewe', done: false, note: '' };
        data.groceries.push(hit);
        save('groceries', [hit]);
      }
      render();
    }

        h += '<div class="meal-card' + (isToday ? ' is-today' : '') + '" data-day="' + idx + '">' +
          '<div class="meal-top"><span class="meal-day">' + esc(dayName) + (isToday ? ' · Heute' : '') + '</span></div>' +
          '<div class="meal-dish' + (!m.title ? ' empty-dish' : '') + '" data-edit-meal>' + (m.title ? esc(m.title) : '+ Gericht planen') + '</div>' +
          (m.ingredients ? '<div class="meal-ing">Zutaten: ' + esc(m.ingredients) + '</div>' : '') +
          '<div class="meal-actions">' +
          '  <button class="meal-btn" data-edit-meal>' + (m.title ? 'Bearbeiten' : 'Planen') + '</button>' +
          (m.ingredients ? '  <button class="meal-btn meal-btn--cart" data-cart="' + idx + '">🛒 Auf Einkaufsliste</button>' : '') +
          (m.title ? '  <button class="meal-btn del" data-clear-meal="' + idx + '" style="margin-left:auto">✕</button>' : '') +
          '</div>' +
          '<div class="meal-edit-box" id="editBox_' + idx + '">' +
          '  <input type="text" id="titleInput_' + idx + '" placeholder="Gericht (z. B. Pasta Carbonara)" value="' + esc(m.title) + '">' +
          '  <input type="text" id="ingInput_' + idx + '" placeholder="Zutaten durch Komma getrennt (z. B. Nudeln, Eier, Speck)" value="' + esc(m.ingredients) + '">' +
          '  <div style="display:flex;gap:8px"><button class="meal-btn meal-btn--cart" data-save-meal="' + idx + '">Speichern</button>' +
          '  <button class="meal-btn" data-cancel-meal="' + idx + '">Abbrechen</button></div>' +
          '</div>' +
          '</div>';
      });

      el.innerHTML = h;
    }

    // ---------------- High-Protein Rezeptdatenbank
    function getAllRecipes() {
      var custom = (data.recipes || []).filter(function (r) {
        return !BASE_RECIPES.some(function (b) { return b.id === r.id; });
      });
      return [].concat(BASE_RECIPES, custom);
    }

    function renderRecipes(el) {
      var all = getAllRecipes();
      var filtered = all.filter(function (r) {
        if (rcpFilter !== 'all' && r.category !== rcpFilter) return false;
        if (rcpSearch) {
          var q = rcpSearch.toLowerCase();
          var titleHit = (r.title || '').toLowerCase().indexOf(q) > -1;
          var descHit = (r.description || '').toLowerCase().indexOf(q) > -1;
          var ingHit = Array.isArray(r.ingredients) ? r.ingredients.some(function (i) { return i.toLowerCase().indexOf(q) > -1; }) : false;
          return titleHit || descHit || ingHit;
        }
        return true;
      });

      var badgeClass = function (cat) {
        if (cat === 'airfryer') return 'badge-airfryer';
        if (cat === 'ricecooker') return 'badge-ricecooker';
        if (cat === 'oven') return 'badge-oven';
        return 'badge-pan';
      };

      // Filter Chips
      var filters = [
        ['all', 'Alle (' + all.length + ')'],
        ['airfryer', '🍟 Airfryer'],
        ['ricecooker', '🍚 Reiskocher'],
        ['oven', '🥘 Backofen'],
        ['pan', '🍳 Schnell']
      ];

      var filterHtml = '<div class="rcp-filter-row">' + filters.map(function (f) {
        return '<button class="chip' + (rcpFilter === f[0] ? ' is-on' : '') + '" data-rcp-filter="' + f[0] + '">' + f[1] + '</button>';
      }).join('') + '</div>';

      // Such- & Aktionsleiste
      var actionHtml = '<div class="rcp-actions-row">' +
        '<input type="text" id="rcpSearchInput" class="rcp-search" placeholder="Rezept oder Zutat suchen…" value="' + esc(rcpSearch) + '">' +
        '<button class="rcp-top-btn" id="btnRcpRandom">🎲 Zufall</button>' +
        '<button class="rcp-top-btn rcp-top-btn--ai" id="btnToggleAi">✨ KI' + (aiOpen ? ' ▲' : ' ▼') + '</button>' +
      '</div>';

      // Gemini KI Panel
      var aiHtml = '';
      if (aiOpen) {
        aiHtml = '<div class="rcp-ai-panel">' +
          '<h3><span>✨ Gemini 3.8 Flash KI-Chef</span>' +
          '<button id="btnSetKey" style="background:none;border:0;color:#c084fc;font-size:11px;cursor:pointer;text-decoration:underline">' +
          (hasGeminiKey ? '🔑 Key aktiv' : '🔑 Key hinterlegen') + '</button></h3>' +
          '<p>Generiere ein maßgeschneidertes High-Protein Rezept für deine Küchengeräte:</p>' +
          '<textarea id="aiPrompt" placeholder="z. B. Hähnchen mit Reis und Brokkoli, max. 15 Minuten Zubereitungszeit..."></textarea>' +
          '<select id="aiCategory">' +
          '  <option value="airfryer">🍟 Heißluftfritteuse (Airfryer)</option>' +
          '  <option value="ricecooker">🍚 Reiskocher One-Pot</option>' +
          '  <option value="oven">🥘 Backofen / Blechgericht</option>' +
          '  <option value="pan">🍳 15-Minuten Pfanne / Wok</option>' +
          '</select>' +
          '<button class="rcp-ai-btn" id="btnGenAi"' + (aiBusy ? ' disabled' : '') + '>' +
          (aiBusy ? '⏳ Gemini kreiert Rezept...' : '🚀 Rezept per KI zaubern') + '</button>';

        if (aiRecipe) {
          aiHtml += '<div class="rcp-ai-res">' +
            '<div class="rcp-head">' +
            '  <span class="rcp-title">' + esc(aiRecipe.title) + '</span>' +
            '  <span class="rcp-badge ' + badgeClass(aiRecipe.category) + '">' + esc(aiRecipe.badge || 'KI-Rezept') + '</span>' +
            '</div>' +
            '<div class="rcp-meta-pills">' +
            '  <span class="rcp-pill">⏱️ ' + (aiRecipe.time || 15) + ' Min</span>' +
            '  <span class="rcp-pill rcp-pill--prot">💪 ' + (aiRecipe.protein || 45) + 'g Protein</span>' +
            '  <span class="rcp-pill">🔥 ' + (aiRecipe.calories || 450) + ' kcal</span>' +
            '</div>' +
            '<p class="rcp-desc">' + esc(aiRecipe.description) + '</p>' +
            '<div style="font-size:12px;margin-bottom:8px"><b>Zutaten:</b><ul style="list-style:disc inside;margin-top:4px">' +
            (aiRecipe.ingredients || []).map(function (it) { return '<li>' + esc(it) + '</li>'; }).join('') +
            '</ul></div>' +
            '<div style="font-size:12px;margin-bottom:12px"><b>Zubereitung:</b><ol style="list-style:decimal inside;margin-top:4px">' +
            (aiRecipe.steps || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') +
            '</ol></div>' +
            '<div class="rcp-actions">' +
            '  <button class="meal-btn" id="btnSaveAiRcp" style="background:#2563eb;color:#fff;border-color:#2563eb">⭐ In Sammlung speichern</button>' +
            '  <button class="meal-btn meal-btn--cart" id="btnAiCart">🛒 Auf Einkaufsliste</button>' +
            '  <select class="rcp-select-day" id="selectAiDay"><option value="">📅 Für Tag planen…</option>' +
            DAYS.map(function (d, i) { return '<option value="' + i + '">' + d + '</option>'; }).join('') +
            '  </select>' +
            '</div>' +
          '</div>';
        }
        aiHtml += '</div>';
      }

      // Rezeptkarten
      var cardsHtml = '';
      if (!filtered.length) {
        cardsHtml = '<div class="empty">Keine passenden Rezepte gefunden 🔍</div>';
      } else {
        cardsHtml = filtered.map(function (r) {
          var isCustom = !BASE_RECIPES.some(function (b) { return b.id === r.id; });
          var ingLines = (r.ingredients || []).map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('');
          var stepLines = (r.steps || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('');

          return '<div class="rcp-card" data-rcp-id="' + esc(r.id) + '">' +
            '<div class="rcp-head">' +
            '  <span class="rcp-title">' + esc(r.title) + '</span>' +
            '  <span class="rcp-badge ' + badgeClass(r.category) + '">' + esc(r.badge || 'Rezept') + '</span>' +
            '</div>' +
            '<div class="rcp-meta-pills">' +
            '  <span class="rcp-pill">⏱️ ' + (r.time || 15) + ' Min</span>' +
            '  <span class="rcp-pill rcp-pill--prot">💪 ' + (r.protein || 40) + 'g Protein</span>' +
            '  <span class="rcp-pill">🔥 ' + (r.calories || 450) + ' kcal</span>' +
            (isCustom ? '  <span class="rcp-pill" style="color:#c084fc;background:rgba(139,92,246,0.2)">✨ Custom / KI</span>' : '') +
            '</div>' +
            '<p class="rcp-desc">' + esc(r.description) + '</p>' +
            '<div class="rcp-details" id="details_' + esc(r.id) + '">' +
            '  <div class="rcp-section-title">Zutaten:</div>' +
            '  <ul class="rcp-ing-list">' + ingLines + '</ul>' +
            '  <div class="rcp-section-title">Zubereitung:</div>' +
            '  <ol class="rcp-step-list">' + stepLines + '</ol>' +
            '</div>' +
            '<div class="rcp-actions">' +
            '  <button class="meal-btn" data-toggle-details="' + esc(r.id) + '">Schritte &amp; Zutaten</button>' +
            '  <select class="rcp-select-day" data-plan-select="' + esc(r.id) + '">' +
            '    <option value="">📅 In Wochenplan…</option>' +
            DAYS.map(function (d, i) { return '<option value="' + i + '">' + d + '</option>'; }).join('') +
            '  </select>' +
            '  <button class="meal-btn meal-btn--cart" data-rcp-cart="' + esc(r.id) + '">🛒 Zutaten</button>' +
            (isCustom ? '  <button class="meal-btn del" data-del-rcp="' + esc(r.id) + '" style="margin-left:auto">✕</button>' : '') +
            '</div>' +
          '</div>';
        }).join('');
      }

      el.innerHTML = filterHtml + actionHtml + aiHtml + cardsHtml;

      var searchInp = document.getElementById('rcpSearchInput');
      if (searchInp) {
        searchInp.oninput = function () {
          rcpSearch = this.value;
          render();
          var updatedInp = document.getElementById('rcpSearchInput');
          if (updatedInp) { updatedInp.focus(); updatedInp.setSelectionRange(rcpSearch.length, rcpSearch.length); }
        };
      }
    }

    function addIngredientsToCart(ingString) {
      if (!ingString) return;
      var items = ingString.split(/[,;\n]+/).map(function (s) { return s.trim(); }).filter(Boolean);
      var added = 0;
      items.forEach(function (it) {
        var low = it.toLowerCase();
        var existing = data.groceries.filter(function (g) { return g.name.toLowerCase() === low; })[0];
        if (existing) {
          if (existing.done) { existing.done = false; existing.qty = 1; }
          else { existing.qty++; }
          save('groceries', [existing]);
        } else {
          var matched = CATALOG.filter(function (c) { return c[0].toLowerCase() === low; })[0];
          var g = { id: uid('g'), name: matched ? matched[0] : (it.charAt(0).toUpperCase() + it.slice(1)), cat: categorize(it), qty: 1, store: 'rewe', done: false, note: '' };
          data.groceries.push(g);
          save('groceries', [g]);
        }
        added++;
      });
      toast(added + ' Zutaten auf die Einkaufsliste gesetzt! 🛒');
    }

    function planRecipeForDay(rcp, dayIdx) {
      var m = data.meals.filter(function (x) { return x.day === dayIdx; })[0];
      var ingText = Array.isArray(rcp.ingredients) ? rcp.ingredients.join(', ') : (rcp.ingredients || '');
      if (!m) {
        m = { id: 'm_' + dayIdx, day: dayIdx, title: rcp.title, ingredients: ingText };
        data.meals.push(m);
      } else {
        m.title = rcp.title;
        m.ingredients = ingText;
      }
      save('meals', [m]);
      toast('Für ' + DAYS[dayIdx] + ' eingeplant! 📅');
    }

    function generateAiRecipe() {
      var p = document.getElementById('aiPrompt');
      var cat = document.getElementById('aiCategory');
      var promptText = p ? p.value.trim() : '';
      var category = cat ? cat.value : 'airfryer';
      if (!promptText) promptText = 'Schnelles High-Protein Gericht für ' + category;

      aiBusy = true;
      render();

      fetch('/api/recipes/ai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Pin': localStorage.getItem('upload_pin') || '' },
        body: JSON.stringify({ prompt: promptText, category: category })
      }).then(function (r) {
        return r.json();
      }).then(function (res) {
        aiBusy = false;
        if (res.ok && res.recipe) {
          aiRecipe = res.recipe;
          aiRecipe.id = 'rcp_ai_' + Date.now();
          toast('Neues KI-Rezept kreiert! ✨');
        } else {
          toast('Fehler: ' + (res.error || 'Generierung fehlgeschlagen'));
        }
        render();
      }).catch(function (e) {
        aiBusy = false;
        toast('Netzwerkfehler bei KI-Generierung');
        render();
      });
    }

    function render() {
      var el = document.getElementById('app');
      var focused = document.activeElement && document.activeElement.id === 'addInput';
      var typed = focused ? document.activeElement.value : '';
      var keepSel = focused ? [document.getElementById('addInput').selectionStart] : null;

      document.getElementById('title').textContent = tab === 'groceries' ? 'Einkaufsliste' : tab === 'chores' ? 'Aufgaben heute' : tab === 'meals' ? 'Wochen-Essensplan' : 'High-Protein Rezepte';
      document.getElementById('edit').style.display = tab === 'chores' ? '' : 'none';
      document.getElementById('edit').textContent = editMode ? 'Fertig' : 'Bearbeiten';
      document.getElementById('tabShop').className = tab === 'groceries' ? 'on' : '';
      document.getElementById('tabTasks').className = tab === 'chores' ? 'on' : '';
      document.getElementById('tabMeals').className = tab === 'meals' ? 'on' : '';
      document.getElementById('tabRecipes').className = tab === 'recipes' ? 'on' : '';

      if (!loaded) { el.innerHTML = '<div class="empty">Lade…</div>'; return; }
      if (tab === 'groceries') renderShop(el);
      else if (tab === 'chores') renderTasks(el);
      else if (tab === 'meals') renderMeals(el);
      else renderRecipes(el);

      if (focused) { var i = document.getElementById('addInput'); if (i) { i.value = typed; i.focus(); try { i.setSelectionRange(keepSel[0], keepSel[0]); } catch (e) {} } }
    }

    document.getElementById('app').addEventListener('click', function (e) {
      // Schnellwahl Chips
      var qk = e.target.closest('[data-quick]');
      if (qk) { addGrocery(qk.dataset.quick); return; }

      // Einkaufsliste & Aufgaben
      var row = e.target.closest('.row');
      if (row && (tab === 'groceries' || tab === 'chores')) {
        var item = data[tab].filter(function (i) { return i.id === row.dataset.id; })[0];
        if (!item) return;
        if (e.target.closest('[data-del]')) return remove(tab, [item.id]);
        var q = e.target.closest('[data-q]');
        if (q) { item.qty = Math.max(1, item.qty + parseInt(q.dataset.q, 10)); save(tab, [item]); return render(); }
        if (e.target.closest('[data-toggle]')) { item.done = !item.done; save(tab, [item]); render(); return; }
      }

      // Wochenplan Quick Action Buttons
      if (e.target.id === 'btnGoRecipes') {
        tab = 'recipes';
        render();
        return;
      }
      if (e.target.id === 'btnRandomMealIdea') {
        var pool = getAllRecipes();
        var pick = pool[Math.floor(Math.random() * pool.length)];
        var cur = currentDayIdx();
        var targetDay = cur;
        for (var d = 0; d < 7; d++) {
          var checkDay = (cur + d) % 7;
          var hasMeal = data.meals.some(function (m) { return m.day === checkDay && m.title; });
          if (!hasMeal) { targetDay = checkDay; break; }
        }
        planRecipeForDay(pick, targetDay);
        render();
        return;
      }
      if (e.target.id === 'btnAiMealIdea') {
        tab = 'recipes';
        aiOpen = true;
        render();
        var p = document.getElementById('aiPrompt'); if (p) p.focus();
        return;
      }

      // Wochenplan Events
      if (tab === 'meals') {
        var mealCard = e.target.closest('.meal-card');
        if (!mealCard) return;
        var dayIdx = parseInt(mealCard.dataset.day, 10);
        var m = data.meals.filter(function (x) { return x.day === dayIdx; })[0];

        if (e.target.closest('[data-cart]')) {
          if (m && m.ingredients) addIngredientsToCart(m.ingredients);
          return;
        }

        if (e.target.closest('[data-clear-meal]')) {
          if (m) {
            remove('meals', [m.id]);
            toast('Gericht gelöscht');
          }
          return;
        }

        if (e.target.closest('[data-edit-meal]')) {
          var box = document.getElementById('editBox_' + dayIdx);
          if (box) {
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
            var ti = document.getElementById('titleInput_' + dayIdx);
            if (box.style.display === 'block' && ti) ti.focus();
          }
          return;
        }

        if (e.target.closest('[data-cancel-meal]')) {
          var b = document.getElementById('editBox_' + dayIdx);
          if (b) b.style.display = 'none';
          return;
        }

        if (e.target.closest('[data-save-meal]')) {
          var titleInp = document.getElementById('titleInput_' + dayIdx);
          var ingInp = document.getElementById('ingInput_' + dayIdx);
          var newTitle = titleInp ? titleInp.value.trim() : '';
          var newIng = ingInp ? ingInp.value.trim() : '';
          if (!m) {
            m = { id: 'm_' + dayIdx, day: dayIdx, title: newTitle, ingredients: newIng };
            data.meals.push(m);
          } else {
            m.title = newTitle;
            m.ingredients = newIng;
          }
          save('meals', [m]);
          toast('Gericht für ' + DAYS[dayIdx] + ' gespeichert');
          render();
          return;
        }
      }

      // Rezepte Tab Events
      if (tab === 'recipes') {
        var chip = e.target.closest('[data-rcp-filter]');
        if (chip) {
          rcpFilter = chip.dataset.rcpFilter;
          render();
          return;
        }

        if (e.target.id === 'btnRcpRandom') {
          var matching = getAllRecipes().filter(function (r) {
            return rcpFilter === 'all' || r.category === rcpFilter;
          });
          if (matching.length) {
            var lucky = matching[Math.floor(Math.random() * matching.length)];
            toast('Zufallsidee: ' + lucky.title + ' 🎲');
            var cardEl = document.querySelector('[data-rcp-id="' + lucky.id + '"]');
            if (cardEl) {
              cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
              var det = document.getElementById('details_' + lucky.id);
              if (det) det.classList.add('open');
            }
          }
          return;
        }

        if (e.target.id === 'btnToggleAi') {
          aiOpen = !aiOpen;
          render();
          return;
        }

        if (e.target.id === 'btnSetKey') {
          var current = prompt('Google AI Studio API Key (AIza...):');
          if (current !== null) {
            fetch('/api/settings/gemini', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Pin': localStorage.getItem('upload_pin') || '' },
              body: JSON.stringify({ key: current.trim() })
            }).then(function (r) { return r.json(); }).then(function (res) {
              if (res.ok) {
                toast('Google AI Studio Key gespeichert! 🔑');
                hasGeminiKey = Boolean(current.trim());
                render();
              } else {
                toast('Fehler beim Speichern: ' + (res.error || ''));
              }
            });
          }
          return;
        }

        if (e.target.id === 'btnGenAi') {
          generateAiRecipe();
          return;
        }

        if (e.target.id === 'btnSaveAiRcp') {
          if (aiRecipe) {
            data.recipes.push(aiRecipe);
            save('recipes', [aiRecipe]);
            toast('Rezept in Datenbank gesichert! ⭐');
            render();
          }
          return;
        }

        if (e.target.id === 'btnAiCart') {
          if (aiRecipe && aiRecipe.ingredients) {
            addIngredientsToCart(aiRecipe.ingredients.join(', '));
          }
          return;
        }

        var toggleDetails = e.target.closest('[data-toggle-details]');
        if (toggleDetails) {
          var id = toggleDetails.dataset.toggleDetails;
          var detailsBox = document.getElementById('details_' + id);
          if (detailsBox) detailsBox.classList.toggle('open');
          return;
        }

        var rcpCart = e.target.closest('[data-rcp-cart]');
        if (rcpCart) {
          var rcpId = rcpCart.dataset.rcpCart;
          var rcp = getAllRecipes().filter(function (x) { return x.id === rcpId; })[0];
          if (rcp && rcp.ingredients) {
            addIngredientsToCart(rcp.ingredients.join(', '));
          }
          return;
        }

        var delRcp = e.target.closest('[data-del-rcp]');
        if (delRcp) {
          var delId = delRcp.dataset.delRcp;
          remove('recipes', [delId]);
          toast('Rezept gelöscht');
          return;
        }
      }
    });

    // Dropdown-Änderungen für Essensplaner
    document.getElementById('app').addEventListener('change', function (e) {
      if (e.target.id === 'selectAiDay') {
        var day = parseInt(e.target.value, 10);
        if (!isNaN(day) && aiRecipe) {
          planRecipeForDay(aiRecipe, day);
          e.target.value = '';
        }
        return;
      }
      var planSel = e.target.closest('[data-plan-select]');
      if (planSel) {
        var dIdx = parseInt(planSel.value, 10);
        var rId = planSel.dataset.planSelect;
        if (!isNaN(dIdx)) {
          var r = getAllRecipes().filter(function (x) { return x.id === rId; })[0];
          if (r) planRecipeForDay(r, dIdx);
          planSel.value = '';
        }
      }
    });

    document.getElementById('tabShop').onclick = function () { tab = 'groceries'; render(); };
    document.getElementById('tabTasks').onclick = function () { tab = 'chores'; render(); };
    document.getElementById('tabMeals').onclick = function () { tab = 'meals'; render(); };
    document.getElementById('tabRecipes').onclick = function () { tab = 'recipes'; load('recipes'); render(); };
    document.getElementById('edit').onclick = function () { editMode = !editMode; render(); };

    loadAll();
    setInterval(function () { if (!document.hidden) loadActive(); }, 30000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) loadActive(); });
  </script>
</body>
</html>
